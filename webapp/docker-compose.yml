version: '3.8'
services:
  redis:
    image: redis:7
    ports:
      - "6379:6379"

  web:
    build: .
    working_dir: /app/webapp
    volumes:
      - ..:/app:cached
    command: uvicorn app:app --host 0.0.0.0 --port 8000 --reload
    ports:
      - "8000:8000"
    env_file:
      - ./.env.example
    depends_on:
      - redis

  worker:
    build: .
    working_dir: /app/webapp
    volumes:
      - ..:/app:cached
    command: celery -A celery_app.celery worker --loglevel=info
    env_file:
      - ./.env.example
    depends_on:
      - redis
